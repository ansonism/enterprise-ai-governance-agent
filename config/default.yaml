{
  "app": {
    "name": "enterprise-ai-governance-agent",
    "environment": "local"
  },
  "provider": {
    "name": "mock",
    "model": "mock-v1",
    "timeout_seconds": 30,
    "max_retries": 2
  },
  "workflow": {
    "stages": [
      "inventory_ai_system",
      "classify_use_case_and_data",
      "map_policies_and_controls",
      "evaluate_identity_permissions_and_tool_access",
      "evaluate_privacy_security_and_data_handling",
      "evaluate_model_and_agent_risk",
      "check_evaluation_and_monitoring_evidence",
      "compute_governance_posture",
      "produce_remediation_and_approval_plan"
    ],
    "checkpoint_each_stage": true,
    "state_directory": "out/state"
  },
  "risk": {
    "default_approval_threshold": "HIGH"
  },
  "approval": {
    "mode": "manual",
    "required_for_mutations": true
  },
  "observability": {
    "log_level": "INFO",
    "structured": true
  },
  "tools": {
    "mode": "fake",
    "allow_mutations": false
  }
}
